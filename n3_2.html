<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number 2</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 3fr; 
      grid-template-rows: 50px 1fr 50px; 
      grid-template-areas:
                "header header"
                "menu article"
                "footer footer";
      gap: 5px;
    }

    .header {
      grid-area: header;
      background-color: lightgray;
      text-align: center;
      padding: 10px;
    }

    .menu {
      grid-area: menu;
      background-color: lightgray;
      text-align: center;
      padding: 10px;
    }

    .article {
      grid-area: article;
      background-color: lightgray;
      text-align: center;
      padding: 10px;
    }

    .footer {
      grid-area: footer;
      background-color: lightgray;
      text-align: center;
      padding: 10px;
    }

    @media (max-width: 700px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        grid-template-areas:
                    "header"
                    "menu"
                    "article"
                    "footer";
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">Название сайта</div>
    <div class="menu">Меню</div>
    <div class="article">Статья</div>
    <div class="footer">Контакты</div>
  </div>

</body>
</html>
