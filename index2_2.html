<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай число</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div>
        <h1>Сыграем?</h1>
        <p>Я загадала число от 1 до 100. Попробуйте угадать!</p>
        <input type="number" id="guessInput" placeholder="Введите число" />
        <button id="guessButton">Проверить</button>
        <p id="resultMessage"></p>
        <button id="restartButton" style="display: none;">Начать заново</button>
    </div>
    <script src="script2.js"></script>
</body>
</html>
